<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 900 260"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#050811"/></linearGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="soft-glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="4"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".4" stroke-width=".8" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulse{0%{transform:scale(.95);opacity:.5}50%{transform:scale(1.15);opacity:.9}}@keyframes dash{0%{stroke-dashoffset:600}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title{font-weight:800;font-size:38px;fill:url(#title-grad)}.subtitle{font-weight:500;font-size:16px;fill:#94a3b8;letter-spacing:.5px}.badge-text{font-weight:600;font-size:12px;fill:#38bdf8;letter-spacing:1px}.wave-line{stroke-dasharray:600;stroke-dashoffset:600;animation:dash 4s ease-in-out infinite alternate}</style><rect width="900" height="260" fill="url(#bg-grad)" rx="16"/><rect width="900" height="260" fill="url(#grid)" rx="16"/><circle cx="150" cy="80" r="90" fill="#3b82f6" filter="url(#glow)" opacity=".15"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0.1;0.25;0.1"/></circle><circle cx="780" cy="180" r="110" fill="#8b5cf6" filter="url(#glow)" opacity=".18"><animate attributeName="opacity" dur="6s" repeatCount="indefinite" values="0.12;0.3;0.12"/></circle><g opacity=".4"><path fill="none" stroke="#38bdf8" stroke-width="3" d="M 500 180 Q 560 100 620 150 T 740 110 T 860 140" class="wave-line" filter="url(#soft-glow)"/><path fill="none" stroke="#a855f7" stroke-width="2" d="M 500 200 Q 570 140 640 170 T 760 130 T 860 160" class="wave-line" opacity=".7"/></g><g transform="translate(100, 0)"><line x1="620" x2="680" y1="90" y2="150" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/><line x1="680" x2="740" y1="150" y2="95" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/><line x1="680" x2="720" y1="150" y2="190" stroke="#334155" stroke-dasharray="4 4" stroke-width="1.5"/><circle cx="620" cy="90" r="7" fill="#38bdf8" filter="url(#soft-glow)"><animate attributeName="r" dur="3s" repeatCount="indefinite" values="5;8;5"/></circle><circle cx="680" cy="150" r="12" fill="#a855f7" filter="url(#glow)"><animate attributeName="r" dur="2.5s" repeatCount="indefinite" values="10;14;10"/></circle><circle cx="740" cy="95" r="8" fill="#ec4899" filter="url(#soft-glow)"><animate attributeName="r" dur="3.5s" repeatCount="indefinite" values="6;9;6"/></circle><circle cx="720" cy="190" r="6" fill="#34d399" filter="url(#soft-glow)"><animate attributeName="r" dur="4s" repeatCount="indefinite" values="5;7;5"/></circle></g><g transform="translate(50, 48)"><rect width="210" height="26" fill="#1e293b" stroke="#334155" stroke-width="1" rx="13"/><circle cx="16" cy="13" r="4" fill="#10b981"><animate attributeName="opacity" dur="1.5s" repeatCount="indefinite" values="0.4;1;0.4"/></circle><text x="28" y="17" class="badge-text">PRODUCTION AGENT INTEL</text></g><text x="50" y="122" class="title" filter="url(#soft-glow)">Awesome AI Agent Analytics</text><text x="50" y="158" class="subtitle">Top SaaS Platforms &amp; Open-Source Projects for AI Agent Performance,</text><text x="50" y="182" class="subtitle">Session Replay, Tok