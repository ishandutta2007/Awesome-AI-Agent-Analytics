<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animated Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: url(#title-grad);
    }
    .subtitle {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 500;
      font-size: 16px;
      fill: #94a3b8;
      letter-spacing: 0.5px;
    }
    .badge-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-weight: 600;
      font-size: 12px;
      fill: #38bdf8;
      letter-spacing: 1px;
    }
    .pulse-circle {
      transform-origin: center;
      animation: pulse 3s infinite ease-in-out;
    }
    .orbit-node {
      animation: orbit 8s infinite linear;
      transform-origin: 750px 130px;
    }
    .wave-line {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: dash 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.5; }
      50% { transform: scale(1.15); opacity: 0.9; }
      100% { transform: scale(0.95); opacity: 0.5; }
    }
    @keyframes dash {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background Layer -->
  <rect width="900" height="260" fill="url(#bg-grad)" rx="16" />
  <rect width="900" height="260" fill="url(#grid)" rx="16" />

  <!-- Dynamic Animated Background Elements -->
  <!-- Ambient Glow Spheres -->
  <circle cx="150" cy="80" r="90" fill="#3b82f6" opacity="0.15" filter="url(#glow)">
    <animate attributeName="opacity" values="0.1;0.25;0.1" dur="5s" repeatCount="indefinite" />
  </circle>
  <circle cx="780" cy="180" r="110" fill="#8b5cf6" opacity="0.18" filter="url(#glow)">
    <animate attributeName="opacity" values="0.12;0.3;0.12" dur="6s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Analytics Wave Graph (Right Side Background) -->
  <g opacity="0.4">
    <path class="wave-line" d="M 500 180 Q 560 100 620 150 T 740 110 T 860 140" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#soft-glow)" />
    <path class="wave-line" d="M 500 200 Q 570 140 640 170 T 760 130 T 860 160" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.7" />
  </g>

  <!-- Dynamic Nodes & Connections (Right Side Visual) -->
  <g transform="translate(100, 0)">
    <!-- Connecting lines -->
    <line x1="620" y1="90" x2="680" y2="150" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="680" y1="150" x2="740" y2="95" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />
    <line x1="680" y1="150" x2="720" y2="190" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Pulsing Node 1 -->
    <circle cx="620" cy="90" r="7" fill="#38bdf8" filter="url(#soft-glow)">
      <animate attributeName="r" values="5;8;5" dur="3s" repeatCount="indefinite" />
    </circle>
    <!-- Pulsing Node 2 (Center Agent Hub) -->
    <circle cx="680" cy="150" r="12" fill="#a855f7" filter="url(#glow)">
      <animate attributeName="r" values="10;14;10" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <!-- Pulsing Node 3 -->
    <circle cx="740" cy="95" r="8" fill="#ec4899" filter="url(#soft-glow)">
      <animate attributeName="r" values="6;9;6" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <!-- Pulsing Node 4 -->
    <circle cx="720" cy="190" r="6" fill="#34d399" filter="url(#soft-glow)">
      <animate attributeName="r" values="5;7;5" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Foreground Content Layer (Text & Branding) -->
  <!-- Tag / Badge Header -->
  <g transform="translate(50, 48)">
    <rect width="210" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="17" class="badge-text">PRODUCTION AGENT INTEL</text>
  </g>

  <!-- Main Title -->
  <text x="50" y="122" class="title" filter="url(#soft-glow)">Awesome AI Agent Analytics</text>

  <!-- Subtitle -->
  <text x="50" y="158" class="subtitle">Top SaaS Platforms &amp; Open-Source Projects for AI Agent Performance,</text>
  <text x="50" y="182" class="subtitle">Session Replay, Token Cost Attribution &amp; LLM Observability Stack.</text>

  <!-- Bottom Tech Tags -->
  <g transform="translate(50, 212)">
    <rect width="90" height="22" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="45" y="15" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">AgentOps</text>

    <rect x="98" width="90" height="22" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="143" y="15" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Langfuse</text>

    <rect x="196" width="90" height="22" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="241" y="15" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">LangSmith</text>

    <rect x="294" width="90" height="22" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="339" y="15" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Arize AX</text>

    <rect x="392" width="90" height="22" rx="6" fill="#0f172a" stroke="#1e293b" />
    <text x="437" y="15" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">OpenTelemetry</text>
  </g>
</svg>
